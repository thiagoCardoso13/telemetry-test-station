services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: station
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-station-local-dev}
      POSTGRES_DB: station
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U station -d station"]
      interval: 5s
      retries: 10

  ingest:
    build: ./station
    command: python -m station.ingest --listen 0.0.0.0:5002 --simulator simulator:5001
    environment:
      DATABASE_URL: postgresql://station:${POSTGRES_PASSWORD:-station-local-dev}@db:5432/station
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # UDP ports are not published: the link has no authentication.
  simulator:
    build: ./station
    command: python -m station.simulator --listen 0.0.0.0:5001 --telemetry ingest:5002 --seed 1
    depends_on:
      - ingest
    restart: unless-stopped

  api:
    build: ./web/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      retries: 10

volumes:
  db-data:
